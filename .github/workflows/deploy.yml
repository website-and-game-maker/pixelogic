name: Deploy to GitHub Pages

# This is a monorepo: `web/` is the site, `apple/` is the native port.
# Only the web half is built and published, and only changes that can affect
# the site trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The smoke test (Playwright) only runs locally; CI just needs unit tests +
      # build, so skip the browser download during `npm ci`.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # A project site is served from /<repo>/, so the Vite base must match the
      # repository name rather than a hard-coded string — that way renaming the
      # repo can't silently ship a build with the wrong asset paths.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Paths here are relative to the workspace root, not working-directory.
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
