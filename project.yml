# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   xcodegen generate
# then open Pixelogic.xcodeproj. Requires full Xcode for iOS/watchOS builds.

name: Pixelogic
options:
  bundleIdPrefix: com.pixelogic
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

packages:
  PixelogicKit:
    path: PixelogicKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # set your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Pixelogic:
    type: application
    platform: iOS
    supportedDestinations: [iOS]    # iPhone + iPad (universal)
    sources:
      - Apps/iOS
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PixelogicKit
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Pixelogic
        UILaunchScreen: {}            # system launch screen, brand bg applied in-app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false   # no custom crypto → no export docs
        LSApplicationCategoryType: public.app-category.puzzle-games
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelogic.app

  PixelogicWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PixelogicKit
    info:
      path: Support/Info-Watch.plist
      properties:
        CFBundleDisplayName: Pixelogic
        WKApplication: true             # standalone watch app (no phone required)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelogic.app.watchkitapp
